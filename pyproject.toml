[project]
name = "citydesk"
version = "0.1.0"
description = "A newsroom you run to learn LangChain 1.x and LangGraph by doing the job."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.4.7,<2",
  "langgraph>=1.2.18,<2",
  "langchain-text-splitters>=1.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2",
  "numpy>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["citydesk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
